<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>足球经理 - 管理中心</title>
<style>
:root{--bg:#080c12;--srf:#0f141c;--bd:#1a2332;--tx:#a8b4c4;--dm:#4a5568;
 --ac:#3b82f6;--acg:rgba(59,130,246,.12);--gr:#22c55e;--or:#f59e0b;--rd:#ef4444;--pu:#a855f7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;overflow:hidden}
/* nav */
#nav{width:56px;background:var(--srf);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:4px;flex-shrink:0}
#nav .nav-item{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--dm);transition:all .15s}
#nav .nav-item:hover,.nav-item.active{background:var(--acg);color:var(--ac)}
#nav .nav-item.active{background:var(--ac);color:#fff}
#nav-brand{font-size:22px;margin-bottom:12px;color:var(--gr)}
/* panel */
#panel{width:340px;background:var(--srf);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.panel-h h2{font-size:14px;font-weight:700;color:#fff;letter-spacing:-.01em}
.panel-h .count{font-size:11px;color:var(--dm);background:var(--bd);padding:2px 8px;border-radius:3px}
.panel-toolbar{padding:8px 12px;display:flex;gap:6px;border-bottom:1px solid var(--bd)}
.panel-toolbar input{flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;color:var(--tx);font-size:12px;outline:none}
.panel-toolbar input:focus{border-color:var(--ac)}
.panel-scroll{flex:1;overflow-y:auto;padding:6px}
.panel-scroll::-webkit-scrollbar{width:3px}
.panel-scroll::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
/* player item */
.p-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:2px;transition:background .12s}
.p-item:hover{background:rgba(255,255,255,.03)}
.p-item.sel{background:var(--acg);border:1px solid rgba(59,130,246,.2)}
.p-item .dnd{padding:0 4px;font-size:14px;cursor:grab;color:var(--dm)}
.p-item .icon{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.icon-gk{background:var(--or)} .icon-df{background:var(--ac)} .icon-md{background:var(--pu)} .icon-at{background:var(--rd)}
.p-item .info{flex:1;min-width:0}
.p-item .info .nm{font-size:12px;font-weight:600;color:#fff}
.p-item .info .rl{font-size:10px;color:var(--dm)}
.p-item .badge{font-size:9px;padding:1px 6px;border-radius:3px;font-weight:600;flex-shrink:0;margin-left:4px}
.badge-starter{background:rgba(59,130,246,.2);color:var(--ac)}
.badge-star{background:rgba(168,85,247,.2);color:var(--pu)}
.badge-rotation{background:rgba(34,197,94,.2);color:var(--gr)}
.badge-youth{background:rgba(255,255,255,.06);color:var(--dm)}
.badge-legend{background:rgba(245,158,11,.2);color:var(--or)}
.p-item .check{font-size:16px;color:var(--dm)}
.p-item .check.checked{color:var(--gr);font-weight:700}
/* main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#main-h{padding:12px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;min-height:48px}
#main-content{flex:1;overflow-y:auto;padding:20px 24px}
#main-content::-webkit-scrollbar{width:4px}
#main-content::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
/* attr grid */
.attr-meta{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.attr-meta .av{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff}
.attr-meta h3{font-size:18px;color:#fff}
.attr-meta .sub{font-size:12px;color:var(--dm)}
.attr-meta .act{display:flex;gap:6px}
.attr-cat{margin-bottom:16px}
.attr-cat-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--dm);margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.attr-row{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:4px}
.attr-row:hover{background:rgba(255,255,255,.015)}
.attr-row span{font-size:12px}
.attr-row .at-v{font-weight:700;color:#fff;min-width:32px;text-align:right}
.attr-row .at-v.lo{color:var(--rd)} .attr-row .at-v.hi{color:var(--gr)} .attr-row .at-v.mi{color:var(--or)}
.attr-row input{width:52px;background:var(--bg);border:1px solid var(--bd);border-radius:3px;padding:3px 6px;color:#fff;font-size:12px;text-align:right;font-weight:700}
.attr-row input:focus{border-color:var(--ac);outline:none}
.attr-row .gk-n{font-size:9px;color:var(--dm);margin-left:4px}
/* match view */
.match-setup{display:flex;gap:16px;align-items:stretch}
.match-setup .team-slot{flex:1;background:var(--srf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;min-height:160px}
.match-setup .team-slot h3{font-size:13px;color:#fff;margin-bottom:8px}
.match-slot-placeholder{padding:8px 0;color:var(--dm);font-size:12px;cursor:pointer}
.match-slot-player{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:11px;color:var(--tx)}
.match-slot-player .rm-btn{color:var(--rd);cursor:pointer;font-size:14px;margin-left:auto}
.tactics-form{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.tactics-form label{font-size:10px;color:var(--dm);text-transform:uppercase;letter-spacing:.03em}
.tactics-form select{background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:4px 8px;color:var(--tx);font-size:11px}
.match-commentary{flex:1;overflow-y:auto;margin-top:12px;font-size:12px;line-height:1.6}
.match-commentary .ev{color:var(--dm)}
.match-commentary .ev.goal{color:var(--gr);font-weight:700}
.match-commentary .ev.miss{color:var(--rd)}
/* pitch */
.pitch-mini{position:relative;width:100%;aspect-ratio:1/1.3;background:linear-gradient(180deg,#1a5c1a 0%,#0f3b0f 50%,#1a5c1a 100%);border:2px solid rgba(255,255,255,.15);border-radius:6px;overflow:hidden;margin:8px 0}
.pitch-mini .pitch-halfline{position:absolute;left:0;right:0;top:50%;border-top:1px solid rgba(255,255,255,.2)}
.pitch-mini .pitch-center-circle{position:absolute;left:50%;top:50%;width:16%;aspect-ratio:1;border:1px solid rgba(255,255,255,.2);border-radius:50%;transform:translate(-50%,-50%)}
.pitch-mini .pitch-center-dot{position:absolute;left:50%;top:50%;width:3px;height:3px;background:rgba(255,255,255,.4);border-radius:50%;transform:translate(-50%,-50%)}
.pitch-mini .pitch-box-top,.pitch-mini .pitch-box-bottom{position:absolute;left:18%;width:64%;height:16%;border:1px solid rgba(255,255,255,.2)}
.pitch-mini .pitch-box-top{top:0}.pitch-mini .pitch-box-bottom{bottom:0}
.pitch-slot{position:absolute;transform:translate(-50%,-50%);cursor:pointer;text-align:center;min-width:52px;padding:4px 6px;border-radius:6px;border:1.5px dashed rgba(255,255,255,.18);background:rgba(0,0,0,.4);transition:all .12s;font-size:10px;z-index:2}
.pitch-slot:hover{border-color:var(--ac);background:rgba(59,130,246,.15)}
.pitch-slot.filled{border:solid 1.5px var(--ac);background:rgba(59,130,246,.2)}
.pitch-slot .slot-label{font-size:9px;color:rgba(255,255,255,.5);margin-bottom:1px}
.pitch-slot .slot-player{font-size:11px;color:#fff;font-weight:600;line-height:1.1}
/* pool */
.pool-chip{padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.03);border:1px solid var(--bd);cursor:pointer;font-size:11px;color:var(--tx);display:inline-flex;align-items:center;white-space:nowrap;transition:all .12s}
.pool-chip:hover{border-color:var(--ac);background:rgba(59,130,246,.08)}
.match-score{font-size:28px;font-weight:800;color:#fff;text-align:center;margin:12px 0}
.match-score .vs{font-size:14px;color:var(--dm);font-weight:400}
/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--dm)}
.empty .ico{font-size:40px;opacity:.2}
.empty p{font-size:13px}
/* btn */
.btn{padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:#2563eb}
.btn-o{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn-o:hover{background:rgba(255,255,255,.04)}
.btn-d{background:transparent;border:1px solid rgba(239,68,68,.3);color:var(--rd)}.btn-d:hover{background:rgba(239,68,68,.08)}
.btn-sm{padding:4px 8px;font-size:10px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--srf);border:1px solid var(--bd);border-radius:12px;padding:20px;width:460px;max-height:80vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:700;color:#fff;margin-bottom:14px}
.modal .fg{margin-bottom:10px}
.modal label{display:block;font-size:11px;color:var(--dm);margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em}
.modal input,.modal select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;color:var(--tx);font-size:12px}
.modal .fr{display:flex;gap:10px}.modal .fr>*{flex:1}
.modal-ft{display:flex;justify-content:flex-end;gap:6px;margin-top:16px}
/* toast */
#toast{position:fixed;bottom:20px;right:20px;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:600;color:#fff;z-index:200;animation:sUp .3s;background:var(--ac)}
#toast.err{background:var(--rd)} @keyframes sUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
/* match btn select mode */
.item-selectable.p-item{border:1px solid transparent}
.item-selectable.p-item:hover{border-color:var(--ac)}
</style></head>
<body>

<!-- Left Nav -->
<div id="nav">
  <div class="nav-brand">⚽</div>
  <div class="nav-item active" data-view="players" onclick="switchView('players')" title="球员">👤</div>
  <div class="nav-item" data-view="match" onclick="switchView('match')" title="比赛">⚡</div>
</div>

<!-- Left Panel -->
<div id="panel">
  <div class="panel-h"><h2 id="panel-title">球员列表</h2><span class="count" id="panel-count">0</span></div>
  <div class="panel-toolbar" id="panel-toolbar">
    <input id="search" placeholder="搜索..." oninput="renderPanel()">
    <select id="posFilter" onchange="renderPanel()" style="width:72px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 6px;color:var(--tx);font-size:11px">
      <option value="all">全部</option><option value="GK">GK</option><option value="DEF">后防</option><option value="MID">中场</option><option value="ATT">前锋</option>
    </select>
    <button class="btn btn-p btn-sm" onclick="openGenModal()" title="生成">+</button>
    <button class="btn btn-o btn-sm" onclick="openSquadModal()" title="球队">⚡</button>
  </div>
  <div class="panel-scroll" id="panel-scroll"></div>
  <div style="padding:8px 12px;border-top:1px solid var(--bd);display:flex;gap:6px;align-items:center">
    <button class="btn btn-o btn-sm" style="flex:1" onclick="resetAll()">重置</button>
    <span id="saveState" style="flex:1;font-size:11px;color:var(--dm);text-align:center">自动保存</span>
  </div>
</div>

<!-- Main -->
<div id="main">
  <div id="main-h"></div>
  <div id="main-content"><div class="empty"><div class="ico">👤</div><p>选择一个球员查看详情</p></div></div>
</div>

<!-- Gen Modal -->
<div class="modal-bg" id="genModal" style="display:none">
  <div class="modal"><h3>生成新球员</h3>
    <div class="fg"><label>名称</label><input id="gName" value="新球员"></div>
    <div class="fr">
      <div class="fg"><label>位置</label><select id="gRole"></select></div>
      <div class="fg"><label>品质</label><select id="gQual"><option value="youth">青训</option><option value="rotation">轮换</option><option value="starter" selected>主力</option><option value="star">球星</option><option value="legend">传奇</option></select></div>
    </div>
    <div class="fg"><label>种子</label><input type="number" id="gSeed" placeholder="留空=随机" min="1" max="999999"></div>
    <div class="modal-ft"><button class="btn btn-o" onclick="closeModals()">取消</button><button class="btn btn-p" onclick="doGenerate()">生成</button></div>
  </div>
</div>

<div class="modal-bg" id="sqModal" style="display:none">
  <div class="modal"><h3>快速生成球队</h3>
    <div class="fg"><label>名称</label><input id="sqName" value="新球队"></div>
    <div class="fr">
      <div class="fg"><label>品质</label><select id="sqQual"><option value="rotation">轮换</option><option value="starter" selected>主力</option><option value="star">球星</option></select></div>
      <div class="fg"><label>球星数</label><input type="number" id="sqStars" value="2" min="0" max="11"></div>
    </div>
    <div class="modal-ft"><button class="btn btn-o" onclick="closeModals()">取消</button><button class="btn btn-p" onclick="doGenSquad()">生成</button></div>
  </div>
</div>

<div id="toast" style="display:none"></div>

<script>
const API='';
let players=[],roles=[],selectedId=null,editing={},view='players';
let matchHome=[],matchAway=[];
let matchEvents=[],matchScore='';

function roleCat(r){return r==='GK'?'gk':r.startsWith('CB')||r.startsWith('FB')||r.startsWith('WB')?'df':r.startsWith('DM')||r.startsWith('CM')||r.startsWith('AM')?'md':'at'}

async function fetchJ(url,opts){const r=await fetch(API+url,opts);return r.json()}

async function init(){
  players=await fetchJ('/api/players');
  roles=await fetchJ('/api/roles');
  const rs=document.getElementById('gRole');
  const seen=new Set();
  roles.forEach(r=>{if(!seen.has(r.role)){seen.add(r.role);const o=document.createElement('option');o.value=r.role;o.textContent=r.name+' ('+r.role+')';rs.appendChild(o)}});
  renderPanel();
}

// ── View switching ──
function switchView(v){
  view=v; selectedId=null; editing={};
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.view===v));
  document.getElementById('panel-title').textContent=v==='match'?'球员池 (右方配置)':'球员列表';
  document.getElementById('panel-toolbar').style.display='flex';
  document.getElementById('main-h').innerHTML='';
  document.getElementById('main-content').innerHTML='';
  document.querySelector('#panel > div:last-child').style.display=v==='match'?'none':'flex';
  if(v==='match'){
      matchHome=[];matchAway=[];matchEvents=[];matchScore='';
      const mc=document.getElementById('main-content');
      mc.style.padding='0';
      mc.innerHTML=`<iframe src="/match-classic?t=${Date.now()}" style="width:100%;min-height:calc(100vh - 116px);border:none;display:block" id="matchFrame"></iframe>`;
    }
    else { document.getElementById('main-content').style.padding='20px 24px'; }
  renderPanel();
}

// ── Panel rendering ──
function renderPanel(){
  const q=document.getElementById('search').value.toLowerCase();
  const pf=document.getElementById('posFilter')?.value||'all';
  let filtered=players.filter(p=>!q||p.name.toLowerCase().includes(q)||p.role_name.includes(q));
  if(pf!=='all') filtered=filtered.filter(p=>roleCat(p.role)===pf.toLowerCase());
  filtered.sort((a,b)=>{
    const o={gk:0,df:1,md:2,at:3};
    const ca=o[roleCat(a.role)]; const cb=o[roleCat(b.role)];
    if(ca!==cb) return ca-cb;
    return (a.role||'').localeCompare(b.role||'');
  });
  document.getElementById('panel-count').textContent=filtered.length;

  if(view==='match'){
    const byRole={};players.forEach(p=>{const c=roleCat(p.role);if(!byRole[c])byRole[c]=[];byRole[c].push(p)});
    const order={gk:'GK',df:'后卫',md:'中场',at:'前锋'};
    let h='';
    Object.entries(order).forEach(([cat,label])=>{
      const pls=byRole[cat]||[];
      if(pls.length) h+=`<div style="padding:6px 12px;font-size:11px;color:var(--dm);font-weight:600">${label} (${pls.length})</div>`;
      pls.forEach(p=>{
        h+=`<div class="p-item" onclick="selectPlayer('${p.id}')">
          <div class="icon icon-${roleCat(p.role)}">${p.is_gk?'GK':p.role.slice(0,2)}</div>
          <div class="info"><div class="nm">${p.name}</div><div class="rl">${p.role_name} · ${p.quality}</div></div>
          <span class="badge badge-${p.quality}">${p.quality}</span>
        </div>`;
      });
    });
    document.getElementById('panel-scroll').innerHTML=h||'<div style="padding:12px;color:var(--dm);font-size:12px">无球员，请先生成</div>';
  }else{
    document.getElementById('panel-scroll').innerHTML=filtered.map(p=>`
      <div class="p-item${selectedId===p.id?' sel':''}" onclick="selectPlayer('${p.id}')">
        <div class="icon icon-${roleCat(p.role)}">${p.is_gk?'GK':p.role.slice(0,2)}</div>
        <div class="info"><div class="nm">${p.name}</div><div class="rl">${p.role_name} · ${p.quality}</div></div>
        <span class="badge badge-${p.quality}">${p.quality}</span>
      </div>`).join('');
  }
}



// ── Modals ──
function openGenModal(){document.getElementById('genModal').style.display='flex'}
function openSquadModal(){document.getElementById('sqModal').style.display='flex'}
function closeModals(){document.querySelectorAll('.modal-bg').forEach(m=>m.style.display='none')}
async function doGenerate(){
  const name=document.getElementById('gName').value,role=document.getElementById('gRole').value;
  const quality=document.getElementById('gQual').value,seed=document.getElementById('gSeed').value;
  await fetchJ('/api/players/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,role,quality,seed:seed?parseInt(seed):undefined})});
  players=await fetchJ('/api/players'); renderPanel(); closeModals(); toast('已生成');
}
async function doGenSquad(){
  const name=document.getElementById('sqName').value,quality=document.getElementById('sqQual').value;
  const star_count=parseInt(document.getElementById('sqStars').value);
  await fetchJ('/api/players/generate_squad',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,quality,star_count})});
  players=await fetchJ('/api/players'); renderPanel(); closeModals(); toast('球队已生成');
}
async function resetAll(){
  if(!confirm('重置所有?'))return;
  await fetchJ('/api/players/reset',{method:'POST'}); players=await fetchJ('/api/players');
  selectedId=null; document.getElementById('main-content').innerHTML='<div class="empty"><div class="ico">👤</div><p>选择一个球员查看详情</p></div>';
  renderPanel(); toast('已重置');
}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(err?' err':'');t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function setSaveState(s){const el=document.getElementById('saveState');if(!el)return;if(s==='saving'){el.textContent='保存中…';el.style.color='var(--or)'}else if(s==='saved'){el.textContent='已保存';el.style.color='var(--gr)'}else if(s==='err'){el.textContent='保存失败';el.style.color='var(--rd)'}else{el.textContent='自动保存';el.style.color='var(--dm)'}}

// ── Auto-save (debounced PUT) ──
let saveTimer=null,pendingPatch={};
function queueSave(field,value){
  if(!selectedId)return;
  if(field==='attrs'){pendingPatch.attrs=Object.assign({},pendingPatch.attrs||{},value)}
  else{pendingPatch[field]=value}
  setSaveState('saving');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flushSave,400);
}
async function flushSave(){
  if(!selectedId||!Object.keys(pendingPatch).length)return;
  const id=selectedId, body=pendingPatch; pendingPatch={};
  try{
    const r=await fetch('/api/players/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('http '+r.status);
    const updated=await r.json();
    const idx=players.findIndex(x=>String(x.id)===String(id));
    if(idx>=0)players[idx]=updated;
    setSaveState('saved');
    // Update left panel without redrawing the detail (would lose focus)
    renderPanel();
  }catch(e){setSaveState('err')}
}

// ── Player detail / edit ──
function attrClass(v){return v>=15?'hi':v<=8?'lo':'mi'}
function selectPlayer(id){
  selectedId=id; editing={}; pendingPatch={}; setSaveState('idle');
  const p=players.find(x=>String(x.id)===String(id));
  if(!p){return}
  const mc=document.getElementById('main-content');
  mc.style.padding='20px 24px';
  const groups={
    '技术':['触球精度','控制技巧','力量输出','空中能力','防守技术'],
    '心智':['足球理解','队友识别','对手识别','决断速度','集中力'],
    '身体':['身高','耐力','爆发','速度','对抗','体质'],
    '性格':['自信','纪律性','情绪稳定性','团队导向','职业态度'],
  };
  const aliases=p.attr_aliases||{};
  const roleOpts=roles.map(r=>`<option value="${r.role}"${r.role===p.role?' selected':''}>${r.name} (${r.role})</option>`).join('');
  const quals=['youth','rotation','starter','star','legend'];
  const qOpts=quals.map(q=>`<option value="${q}"${q===p.quality?' selected':''}>${q}</option>`).join('');
  let body=`
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
      <div class="icon icon-${roleCat(p.role)}" style="width:48px;height:48px;font-size:14px">${p.is_gk?'GK':p.role.slice(0,2)}</div>
      <div style="flex:1">
        <input id="ed_name" value="${(p.name||'').replace(/"/g,'&quot;')}" oninput="queueSave('name',this.value)" style="width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;color:#fff;font-size:14px;font-weight:700">
      </div>
      <button class="btn btn-o btn-sm" onclick="delPlayer('${p.id}')" style="color:var(--rd);border-color:var(--rd)">删除</button>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:18px">
      <div style="flex:1"><label style="display:block;font-size:11px;color:var(--dm);margin-bottom:3px">位置</label>
        <select id="ed_role" onchange="queueSave('role',this.value)" style="width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;color:var(--tx);font-size:12px">${roleOpts}</select></div>
      <div style="flex:1"><label style="display:block;font-size:11px;color:var(--dm);margin-bottom:3px">档次</label>
        <select id="ed_qual" onchange="queueSave('quality',this.value)" style="width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;color:var(--tx);font-size:12px">${qOpts}</select></div>
      <div style="width:100px"><label style="display:block;font-size:11px;color:var(--dm);margin-bottom:3px">ID</label>
        <div style="padding:7px 10px;color:var(--dm);font-size:12px">#${p.id}</div></div>
    </div>`;
  for(const [gname,attrs] of Object.entries(groups)){
    body+=`<div style="margin-bottom:14px"><div style="font-size:11px;color:var(--dm);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;padding:0 10px">${gname}</div>`;
    for(const a of attrs){
      if(!(a in p.attrs))continue;
      const v=p.attrs[a]; const alias=aliases[a]?` <span class="gk-n">(${aliases[a]})</span>`:'';
      const isHeight = (a === '身高');
      const dispVal = isHeight ? v : v;
      const minVal = isHeight ? 155 : 1;
      const maxVal = isHeight ? 210 : 20;
      const suffix = isHeight ? 'cm' : '';
      body+=`<div class="attr-row"><span>${a}${alias}</span>
        <div style="display:flex;align-items:center;gap:4px"><input type="number" min="${minVal}" max="${maxVal}" value="${dispVal}" data-attr="${a}" oninput="queueSave('attrs',{[this.dataset.attr]:parseInt(this.value)||0})" class="at-v ${isHeight ? '' : attrClass(v)}">${suffix}</div>
      </div>`;
    }
    body+='</div>';
  }
  mc.innerHTML=body;
  renderPanel();
}

async function delPlayer(id){
  if(!confirm('删除此球员?'))return;
  await fetch('/api/players/'+id,{method:'DELETE'});
  players=await fetchJ('/api/players');
  if(String(selectedId)===String(id)){
    selectedId=null;
    document.getElementById('main-content').innerHTML='<div class="empty"><div class="ico">👤</div><p>选择一个球员查看详情</p></div>';
  }
  renderPanel();
  toast('已删除');
}

init();
</script>
</body></html>
